<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<div id="stage"></div>
<script>
/* ============================================================

   Recréation vanilla de l'export Claude Design "TonPilote Animé".
   Deux écrans : ?screen=dashboard (défaut) ou ?screen=planning
   ============================================================ */
(function () {
  'use strict';

  // ---------- Données (identiques à l'export) ----------
  var CH = [
    { name: 'Cuisine Moreau', pct: 15, color: '#22C55E', badge: 'À planifier', tone: 'plan', late: '' },
    { name: 'Extension terrasse Aix-les-Bains', pct: 45, color: '#E9A008', badge: 'En cours', tone: 'cours', late: '' },
    { name: 'LOVE ROOM CHAMBERY', pct: 60, color: '#E23B2B', badge: 'En cours', tone: 'cours', late: '6j' },
    { name: 'rÉNOVATION ANNECY', pct: 20, color: '#22C55E', badge: 'À planifier', tone: 'plan', late: '' },
    { name: 'Terrasse Girard', pct: 55, color: '#E9A008', badge: 'En cours', tone: 'cours', late: '2j' }

  var DONUT = [
    { n: 10, color: '#22C55E' },
    { n: 5, color: '#3B82F6' },
    { n: 4, color: '#F0B429' },
    { n: 3, color: '#EF4444' }
  ];
  var MONTHS = [
    { label: 'Fév', inV: 22, outV: 12 },
    { label: 'Mar', inV: 45, outV: 25 },
    { label: 'Avr', inV: 34, outV: 13 },
    { label: 'Mai', inV: 62, outV: 28 },
    { label: 'Juin', inV: 25, outV: 30 },
    { label: 'Juil', inV: 95, outV: 15 }
  ];
  var ROWS = ['Cuisine Moreau', 'Extension terrass...', 'LOVE ROOM CHA...', 'rÉNOVATION AN...', 'Immeuble Horizo...', 'Terrasse Girard', 'Rénovation salle ...'];
  var CHIPS = [
    { r: 0, d: 1, p: 'Thomas', i: 'TR', c: '#10B981' },
    { r: 0, d: 2, p: 'Thomas', i: 'TR', c: '#10B981' },
    { r: 0, d: 3, p: 'Emrick', i: 'EE', c: '#3B82F6' },
    { r: 0, d: 4, p: 'Lucas', i: 'LP', c: '#8B5CF6' },
    { r: 1, d: 0, p: 'Lucas', i: 'LP', c: '#8B5CF6' },
    { r: 1, d: 1, p: 'Emrick', i: 'EP', c: '#0D9488' },
    { r: 1, d: 2, p: 'Emrick', i: 'EP', c: '#0D9488' },
    { r: 1, d: 4, p: 'Lucas', i: 'LP', c: '#8B5CF6' },
    { r: 1, d: 5, p: 'Antoine', i: 'AC', c: '#F0A020' },
    { r: 2, d: 1, p: 'Antoine', i: 'AC', c: '#F0A020' },
    { r: 2, d: 2, p: 'Emrick', i: 'EE', c: '#3B82F6' },
    { r: 2, d: 3, p: 'Emrick', i: 'EE', c: '#3B82F6' },
    { r: 3, d: 1, p: 'Emrick', i: 'EP', c: '#0D9488' },
    { r: 3, d: 2, p: 'Emrick', i: 'EP', c: '#0D9488' },
    { r: 3, d: 5, p: 'Antoine', i: 'AC', c: '#F0A020' },
    { r: 4, d: 3, p: 'Antoine', i: 'AC', c: '#3B82F6' },
    { r: 4, d: 4, p: 'Antoine', i: 'AC', c: '#3B82F6' },
    { r: 5, d: 2, p: 'Emrick', i: 'EP', c: '#0D9488' },
    { r: 5, d: 4, p: 'Antoine', i: 'AC', c: '#F0A020' },
    { r: 6, d: 1, p: 'Antoine', i: 'AC', c: '#F0A020' },
    { r: 6, d: 4, p: 'Antoine', i: 'AC', c: '#F0A020' }
  ];
  var DAYS = [['LUN', 20], ['MAR', 21], ['MER', 22], ['JEU', 23], ['VEN', 24], ['SAM', 25], ['DIM', 26]];

  var C = 2 * Math.PI * 38;
  var TOTAL = 5.4;
  var HOLD = 2.4;

  // ---------- Easing (identiques à l'export) ----------
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function ease(x) { return 1 - Math.pow(1 - x, 3); }
  function easeBack(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var c = 1.6;
    return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
  }
  function fr(n, dec) {
    var s = n.toFixed(dec);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.join(',');
  }

  // ---------- Icônes SVG réutilisées ----------
  var HOUSE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#E4573C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>';
  function house(sz, col) {
    return '<svg viewBox="0 0 24 24" width="' + sz + '" height="' + sz + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>';
  }

  // ============================================================
  //  ÉCRAN 1 — DASHBOARD (cercles + barres + sparklines + compteurs)
  // ============================================================
  function buildDashboard() {
    var sidebar =
      '<div style="width:205px;flex:none;background:linear-gradient(180deg,#EC6E52 0%,#E2533A 100%);display:flex;flex-direction:column;padding:18px 14px;color:#fff;position:relative">' +
        '<div style="display:flex;align-items:center;gap:10px;padding:0 4px 20px 4px">' +
          '<div style="width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none">' + house(17, '#E4573C') + '</div>' +
          '<div style="display:flex;flex-direction:column;line-height:1"><span style="font-size:19px;font-weight:700;letter-spacing:-0.3px">TonPilote</span><span style="font-size:9px;font-weight:500;opacity:.85;margin-top:3px">by Potentieel</span></div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;background:#fff;color:#E4573C;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(120,40,20,.18)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Tableau de bord</div>' +
        '<div style="display:flex;align-items:center;gap:10px;padding:12px;font-size:13px;font-weight:500;color:rgba(255,255,255,.95)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</div>' +
        '<div style="display:flex;flex-direction:column;gap:2px;margin-top:14px">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 12px;font-size:10.5px;font-weight:600;letter-spacing:.9px;color:rgba(255,255,255,.82)">COMMERCIAL<span style="opacity:.7">&#8250;</span></div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 12px;font-size:10.5px;font-weight:600;letter-spacing:.9px;color:rgba(255,255,255,.82)">CHANTIERS &amp; ÉQUIPES<span style="opacity:.7">&#8250;</span></div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 12px;font-size:10.5px;font-weight:600;letter-spacing:.9px;color:rgba(255,255,255,.82)">ADMIN &amp; FINANCES<span style="opacity:.7">&#8250;</span></div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 12px;font-size:10.5px;font-weight:600;letter-spacing:.9px;color:rgba(255,255,255,.82)">OUTILS<span style="opacity:.7">&#8250;</span></div>' +
        '</div>' +
        '<div style="height:1px;background:rgba(255,255,255,.25);margin:10px 8px"></div>' +
        '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px;font-weight:500"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Paramètres</div>' +
        '<div style="margin-top:auto;display:flex;flex-direction:column;gap:14px">' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.55);border-radius:11px;padding:9px;font-size:12px;font-weight:500">' + house(13, 'currentColor') + 'Vue salarié</div>' +
          '<div style="display:flex;align-items:center;gap:9px;padding-top:4px;border-top:1px solid rgba(255,255,255,.22)"><div style="width:27px;height:27px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;flex:none">EP</div><div style="display:flex;flex-direction:column;line-height:1.25;flex:1"><span style="font-size:12px;font-weight:600">Emrick Perilliat</span><span style="font-size:9.5px;opacity:.8">Artisan</span></div><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></div>' +
        '</div>' +
        '<div style="position:absolute;right:-9px;top:44px;width:18px;height:18px;border-radius:50%;background:#fff;color:#E4573C;display:flex;align-items:center;justify-content:center;font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,.2)">&#8249;</div>' +
      '</div>';

    // Donut segments
    var total = DONUT.reduce(function (a, s) { return a + s.n; }, 0);
    var acc = 0, segHtml = '', starts = [];
    DONUT.forEach(function (s) {
      var start = (acc / total) * C;
      starts.push(start);
      acc += s.n;
      segHtml += '<circle class="d-seg" cx="50" cy="50" r="38" fill="none" stroke="' + s.color + '" stroke-width="10" stroke-linecap="butt" stroke-dasharray="0 ' + (C + 10) + '" stroke-dashoffset="' + (-start) + '"/>';
    });

    var donut =
      '<div style="background:linear-gradient(160deg,#FDF1ED 0%,#FDE7E0 100%);border-radius:15px;padding:18px;display:flex;flex-direction:column">' +
        '<span style="font-size:13.5px;font-weight:600;color:#33302E">Statut des chantiers</span>' +
        '<span style="font-size:11.5px;color:#A08F89;margin-top:2px">Répartition en temps réel</span>' +
        '<div style="display:flex;justify-content:center;padding:14px 0 6px"><div style="position:relative;width:186px;height:186px">' +
          '<svg viewBox="0 0 100 100" width="186" height="186" style="transform:rotate(-90deg)"><circle cx="50" cy="50" r="38" fill="none" stroke="#F6DED6" stroke-width="10"/>' + segHtml + '</svg>' +
          '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:9px;font-weight:600;letter-spacing:1.2px;color:#A79A94">CHANTIERS</span><span id="d-total" style="font-size:34px;font-weight:700;color:#2E2B29;line-height:1">0</span></div>' +
        '</div></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;row-gap:11px;column-gap:8px;margin-top:auto;padding-top:10px">' +
          '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6D6663"><span style="width:8px;height:8px;border-radius:50%;background:#22C55E"></span><b style="color:#2E2B29">10</b> En cours</div>' +
          '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6D6663"><span style="width:8px;height:8px;border-radius:50%;background:#3B82F6"></span><b style="color:#2E2B29">5</b> À démarrer</div>' +
          '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6D6663"><span style="width:8px;height:8px;border-radius:50%;background:#F0B429"></span><b style="color:#2E2B29">4</b> À facturer</div>' +
          '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6D6663"><span style="width:8px;height:8px;border-radius:50%;background:#EF4444"></span><b style="color:#2E2B29">3</b> En retard</div>' +
        '</div>' +
      '</div>';

    var barsHtml = '';
    CH.forEach(function (c) {
      var badgeStyle = 'font-size:10px;font-weight:600;border-radius:7px;padding:3px 9px;white-space:nowrap;' + (c.tone === 'plan' ? 'background:#FDF3DC;color:#B4790C' : 'background:#FDE7E3;color:#D63B25');
      barsHtml +=
        '<div style="display:flex;flex-direction:column;gap:5px">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<div style="width:25px;height:25px;border-radius:8px;background:#FDECE6;display:flex;align-items:center;justify-content:center;flex:none">' + house(13, '#E4573C') + '</div>' +
            '<span style="font-size:13px;font-weight:500;color:#33302E;flex:1">' + c.name + '</span>' +
            (c.late ? '<span style="font-size:10.5px;font-weight:500;color:#D97706">&#9888; ' + c.late + '</span>' : '') +
            '<span style="' + badgeStyle + '">' + c.badge + '</span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;padding-left:35px">' +
            '<div style="flex:1;height:5px;border-radius:3px;background:#EDE9E6;overflow:hidden"><div class="d-bar" data-pct="' + c.pct + '" style="height:100%;border-radius:3px;background:' + c.color + ';width:0%"></div></div>' +
            '<span class="d-pct" data-pct="' + c.pct + '" style="font-size:10.5px;font-weight:600;color:#4B4643;width:30px;text-align:right">0%</span>' +
            '<span style="font-size:10px;color:#B0A29C;width:88px;white-space:nowrap">&#9888; Sans équipe</span>' +
          '</div>' +
        '</div>';
    });

    var progress =
      '<div style="background:#fff;border-radius:15px;padding:16px 18px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(60,40,30,.05)">' +
        '<span style="font-size:13.5px;font-weight:600;color:#33302E">Chantiers actifs · avancement</span>' +
        '<div style="display:flex;flex-direction:column;gap:11px;margin-top:12px">' + barsHtml + '</div>' +
      '</div>';

    var monthsHtml = '';
    MONTHS.forEach(function (m) {
      monthsHtml +=
        '<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;border-bottom:1px solid #F0ECE9">' +

        '</div>';
    });

    var financeRow =
      '<div style="display:grid;grid-template-columns:1fr 1fr 1.55fr;gap:14px">' +
        '<div style="background:linear-gradient(180deg,#fff 55%,#FDEDE8 100%);border-radius:15px;padding:15px;display:flex;flex-direction:column;height:150px;box-shadow:0 1px 3px rgba(60,40,30,.05)">' +
          '<div style="width:30px;height:30px;border-radius:9px;background:#E4573C;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div>' +
          '<span id="d-dep" style="font-size:21px;font-weight:700;color:#2E2B29;margin-top:12px;letter-spacing:-.4px">0,00 €</span>' +
          '<span style="font-size:11.5px;color:#8C817C;margin-top:2px">Dépenses du mois</span>' +
          '<svg viewBox="0 0 300 60" preserveAspectRatio="none" style="width:100%;height:44px;margin-top:auto"><path class="d-spark" d="M0,56 L20,54 L40,50 L60,52 L80,44 L100,48 L120,38 L140,42 L160,34 L180,36 L200,28 L220,32 L240,22 L260,26 L280,16 L300,12" fill="none" stroke="#E23B2B" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>' +
        '</div>' +
        '<div style="background:linear-gradient(180deg,#fff 55%,#E9F7EE 100%);border-radius:15px;padding:15px;display:flex;flex-direction:column;height:150px;box-shadow:0 1px 3px rgba(60,40,30,.05)">' +

          '<span id="d-ent" style="font-size:21px;font-weight:700;color:#2E2B29;margin-top:12px;letter-spacing:-.4px">0,00 €</span>' +
          '<span style="font-size:11.5px;color:#8C817C;margin-top:2px">Entrées du mois</span>' +
          '<svg viewBox="0 0 300 60" preserveAspectRatio="none" style="width:100%;height:44px;margin-top:auto"><path class="d-spark" d="M0,52 L25,48 L50,50 L75,40 L100,42 L125,32 L150,34 L175,26 L200,20 L225,22 L250,14 L275,16 L300,10" fill="none" stroke="#16A34A" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>' +
        '</div>' +
        '<div style="background:#fff;border-radius:15px;padding:15px 17px;display:flex;flex-direction:column;height:150px;box-shadow:0 1px 3px rgba(60,40,30,.05)">' +
          '<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:12.5px;font-weight:600;color:#33302E">Entrées vs dépenses (6 mois)</span><div style="display:flex;gap:12px"><span style="display:flex;align-items:center;gap:5px;font-size:10px;color:#6D6663"><span style="width:7px;height:7px;border-radius:50%;background:#16A34A"></span>Entrées</span><span style="display:flex;align-items:center;gap:5px;font-size:10px;color:#6D6663"><span style="width:7px;height:7px;border-radius:50%;background:#E23B2B"></span>Dépenses</span></div></div>' +
          '<div style="display:flex;gap:8px;align-items:baseline;margin-top:5px"><span id="d-tent" style="font-size:16px;font-weight:700;color:#16A34A">0 €</span><span style="font-size:13px;color:#B5ACA7">/</span><span id="d-tdep" style="font-size:16px;font-weight:700;color:#E23B2B">0 €</span></div>' +
          '<div style="display:flex;gap:8px;flex:1;margin-top:6px;min-height:0">' +
            '<div style="display:flex;flex-direction:column;justify-content:space-between;font-size:8.5px;color:#B5ACA7;padding-bottom:13px"><span>100k</span><span>75k</span><span>50k</span><span>25k</span><span>0</span></div>' +
            '<div style="flex:1;display:grid;grid-template-columns:repeat(6,1fr);border-left:1px solid #F0ECE9">' + monthsHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var main =
      '<div style="flex:1;padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-width:0">' +
        '<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:11px;font-weight:600;letter-spacing:1.1px;color:#A29B97">SUIVI DES CHANTIERS</span><span style="font-size:11.5px;font-weight:500;color:#E4573C">Voir les chantiers</span></div>' +
        '<div style="display:grid;grid-template-columns:310px 1fr;gap:16px">' + donut + progress + '</div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:2px"><span style="font-size:11px;font-weight:600;letter-spacing:1.1px;color:#A29B97">ADMINISTRATIF &amp; COMPTABLE — CE MOIS</span><span style="font-size:11.5px;font-weight:500;color:#E4573C">Voir la compta</span></div>' +
        financeRow +
        '<div style="display:grid;grid-template-columns:1fr 1fr 1.55fr;gap:14px">' +
          '<div style="background:linear-gradient(180deg,#fff,#FDEEE9);border-radius:15px;padding:15px;height:60px;box-shadow:0 1px 3px rgba(60,40,30,.05)"><span style="font-size:13px;font-weight:600;color:#33302E">Répartition des dépenses</span></div>' +
          '<div style="background:linear-gradient(180deg,#fff,#EAF7EF);border-radius:15px;padding:15px;height:60px;box-shadow:0 1px 3px rgba(60,40,30,.05)"><span style="font-size:13px;font-weight:600;color:#33302E">Répartition des entrées</span></div>' +
          '<div></div>' +
        '</div>' +
      '</div>';

    document.getElementById('stage').innerHTML = sidebar + main;
    return { starts: starts, total: total };
  }

  function tickDashboard(t, ctx) {
    var ringP = ease(clamp01((t - 0.25) / 1.6));
    var segs = document.querySelectorAll('.d-seg');
    var acc = 0;
    DONUT.forEach(function (s, i) {
      var start = ctx.starts[i];
      var len = (s.n / ctx.total) * C - 3;
      var vis = Math.max(0, Math.min(len, ringP * C - start));
      segs[i].setAttribute('stroke-dasharray', vis + ' ' + (C + 10));
    });

    document.getElementById('d-total').textContent = Math.round(ctx.total * ease(clamp01((t - 0.35) / 1.4)));

    var bars = document.querySelectorAll('.d-bar');
    var pcts = document.querySelectorAll('.d-pct');
    CH.forEach(function (c, i) {
      var p = ease(clamp01((t - (0.55 + i * 0.17)) / 1.1));
      bars[i].style.width = (c.pct * p) + '%';
      pcts[i].textContent = Math.round(c.pct * p) + '%';
    });

    var numP = ease(clamp01((t - 0.5) / 1.5));
    document.getElementById('d-dep').textContent = fr(11285.4 * numP, 2) + ' €';
    document.getElementById('d-ent').textContent = fr(96420 * numP, 2) + ' €';
    document.getElementById('d-tent').textContent = fr(336215.4 * numP, 2) + ' €';
    document.getElementById('d-tdep').textContent = fr(168932.6 * numP, 2) + ' €';

    var sparkDash = 1 - ease(clamp01((t - 1.1) / 1.5));
    var sparks = document.querySelectorAll('.d-spark');
    for (var si = 0; si < sparks.length; si++) sparks[si].setAttribute('stroke-dashoffset', sparkDash.toFixed(3));

    var mins = document.querySelectorAll('.d-min');
    var mouts = document.querySelectorAll('.d-mout');
    MONTHS.forEach(function (m, i) {
      var p = ease(clamp01((t - (1.5 + i * 0.09)) / 0.9));
      mins[i].style.height = (m.inV * p) + '%';
      mouts[i].style.height = (m.outV * p) + '%';
    });
  }

  // ============================================================
  //  ÉCRAN 2 — PLANNING (chips qui apparaissent + compteurs d'alerte)
  // ============================================================
  function buildPlanning() {
    var navItem = function (icon, label) {
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 11px;font-size:12.5px;font-weight:500">' + icon + ' ' + label + '</div>';
    };
    var sidebar =
      '<div style="width:215px;flex:none;background:linear-gradient(180deg,#EC6E52 0%,#E2533A 100%);display:flex;flex-direction:column;padding:16px 13px;color:#fff;position:relative">' +
        '<div style="display:flex;align-items:center;gap:10px;padding:0 4px 14px 4px"><div style="width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none">' + house(15, '#E4573C') + '</div><span style="font-size:17px;font-weight:700;letter-spacing:-0.3px">TonPilote</span></div>' +
        '<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.95)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Tableau de bord</div>' +
        '<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.95)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</div>' +
        '<div style="padding:12px 11px 6px;font-size:10px;font-weight:600;letter-spacing:.9px;color:rgba(255,255,255,.8);display:flex;justify-content:space-between">COMMERCIAL<span>&#8250;</span></div>' +
        '<div style="padding:8px 11px 4px;font-size:10px;font-weight:600;letter-spacing:.9px;color:rgba(255,255,255,.85);display:flex;justify-content:space-between">CHANTIERS &amp; ÉQUIPES<span>&#8964;</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:1px;margin-top:2px">' +
          navItem('<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>', 'Chantiers') +
          '<div style="display:flex;align-items:center;gap:10px;background:#fff;color:#E4573C;border-radius:11px;padding:10px 11px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(120,40,20,.18)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg> Planning</div>' +
          navItem('<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>', 'Heures') +
          navItem('<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3.2-6.5 7-6.5S19 17 19 21"/></svg>', 'Salariés') +
          navItem('<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5S15 16.7 15 20"/></svg>', 'Sous-traitants') +
          navItem('<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 16V9h11l4 4v3"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>', 'Véhicules') +
          navItem('<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>', 'Comptes-rendus') +
        '</div>' +
        '<div style="padding:12px 11px 4px;font-size:10px;font-weight:600;letter-spacing:.9px;color:rgba(255,255,255,.8);display:flex;justify-content:space-between">ADMIN &amp; FINANCES<span>&#8250;</span></div>' +
        '<div style="padding:8px 11px;font-size:10px;font-weight:600;letter-spacing:.9px;color:rgba(255,255,255,.8);display:flex;justify-content:space-between">OUTILS<span>&#8250;</span></div>' +
        navItem('<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>', 'Paramètres') +
        '<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.55);border-radius:11px;padding:8px;font-size:12px;font-weight:500">' + house(13, 'currentColor') + ' Vue salarié</div>' +
          '<div style="display:flex;align-items:center;gap:9px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22)"><div style="width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex:none">EP</div><div style="display:flex;flex-direction:column;line-height:1.25;flex:1"><span style="font-size:11.5px;font-weight:600">Emrick Perilliat</span><span style="font-size:9px;opacity:.8">Artisan</span></div><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></div>' +
        '</div>' +
        '<div style="position:absolute;right:-9px;top:20px;width:18px;height:18px;border-radius:50%;background:#fff;color:#E4573C;display:flex;align-items:center;justify-content:center;font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,.2)">&#8249;</div>' +
      '</div>';

    // Header days
    var headHtml = '<div style="padding:14px 16px;font-size:10px;font-weight:600;letter-spacing:.9px;color:#A29B97">CHANTIER</div>';
    DAYS.forEach(function (d, i) {
      var hl = i === 2;
      headHtml +=
        '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-left:1px solid #F2EEEB;' + (hl ? 'background:#FEF7F5;' : '') + '">' +
          '<span style="font-size:10px;font-weight:600;letter-spacing:.7px;color:' + (hl ? '#E4573C' : '#A29B97') + '">' + d[0] + '</span>' +
          (hl
            ? '<span style="font-size:12px;font-weight:600;color:#fff;background:#E4573C;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center">' + d[1] + '</span>'
            : '<span style="font-size:14px;font-weight:600;color:#4B4643">' + d[1] + '</span>') +
        '</div>';
    });

    // Rows
    var rowsHtml = '';
    ROWS.forEach(function (name, r) {
      var cells = '';
      DAYS.forEach(function (d, di) {
        var idx = -1;
        for (var k = 0; k < CHIPS.length; k++) { if (CHIPS[k].r === r && CHIPS[k].d === di) { idx = k; break; } }
        var cellStyle = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-left:1px solid #F5F2F0;padding:6px 6px;' + (di === 2 ? 'background:#FEF7F5;' : '');
        var chipHtml = '';
        if (idx >= 0) {
          var ch = CHIPS[idx];
          chipHtml =
            '<div class="p-chip" data-i="' + idx + '" style="display:flex;align-items:center;gap:5px;background:' + ch.c + ';color:#fff;border-radius:8px;padding:3px 7px 3px 3px;font-size:10.5px;font-weight:600;white-space:nowrap;opacity:0;transform:translateY(-7px) scale(0.7)">' +
              '<span style="display:flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.28);font-size:8px;font-weight:700">' + ch.i + '</span>' +
              '<span>' + ch.p + '</span><span style="opacity:.75;font-size:11px">×</span>' +
            '</div>';
        }
        cells +=
          '<div style="' + cellStyle + '">' + chipHtml +
            '<span style="font-size:10px;color:#C6BDB8;font-weight:500;border:1px solid #F0ECE9;border-radius:7px;padding:3px 8px">+ Affecter</span>' +
          '</div>';
      });
      rowsHtml +=
        '<div style="display:grid;grid-template-columns:180px repeat(7,1fr);border-bottom:1px solid #F5F2F0;flex:1;min-height:0">' +
          '<div style="display:flex;align-items:center;gap:9px;padding:0 14px"><div style="width:24px;height:24px;border-radius:8px;background:#FDECE6;display:flex;align-items:center;justify-content:center;flex:none">' + house(12, '#E4573C') + '</div><span style="font-size:12.5px;font-weight:500;color:#33302E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + name + '</span></div>' +
          cells +
        '</div>';
    });

    var main =
      '<div style="flex:1;padding:22px 26px;display:flex;flex-direction:column;min-width:0">' +
        '<span style="font-size:29px;font-weight:700;color:#2E2B29;letter-spacing:-.6px">Planning</span>' +
        '<span style="font-size:13px;color:#8C817C;margin-top:3px">Qui va où, quand, sur quel chantier — jour, semaine ou mois.</span>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px">' +
          '<div style="display:flex;gap:4px;background:#F1EDEA;border-radius:11px;padding:4px"><span style="font-size:12.5px;font-weight:500;color:#7A726E;padding:6px 14px">Jour</span><span style="font-size:12.5px;font-weight:600;color:#fff;background:#E4573C;border-radius:8px;padding:6px 16px">Semaine</span><span style="font-size:12.5px;font-weight:500;color:#7A726E;padding:6px 14px">Mois</span></div>' +
          '<div style="display:flex;align-items:center;gap:8px"><span style="width:28px;height:28px;border-radius:9px;border:1px solid #EAE4E0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8C817C">&#8249;</span><span style="display:flex;align-items:center;gap:8px;border:1px solid #EAE4E0;background:#fff;border-radius:9px;padding:6px 14px;font-size:12.5px;font-weight:500;color:#4B4643"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#E4573C" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Semaine Du 20/07 Au 26/07</span><span style="width:28px;height:28px;border-radius:9px;border:1px solid #EAE4E0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8C817C">&#8250;</span><span style="border:1px solid #EAE4E0;background:#fff;border-radius:9px;padding:6px 14px;font-size:12.5px;font-weight:500;color:#4B4643">Aujourd\'hui</span></div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;margin-top:16px">' +
          '<span style="display:flex;align-items:center;gap:6px;background:#FDEAE6;color:#D63B25;border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:500">&#9888; <span id="p-conf">0</span> conflit d\'affectation</span>' +
          '<span style="display:flex;align-items:center;gap:6px;background:#FDF3DC;color:#B4790C;border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:500">&#9888; <span id="p-sans">7</span> chantiers sans équipe</span>' +
          '<span style="display:flex;align-items:center;gap:6px;background:#F3F1EF;color:#7A726E;border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:500"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16a4 4 0 0 1 .8-7.9 5.5 5.5 0 0 1 10.6 1.4A3.5 3.5 0 0 1 17 16z"/></svg>0 alerte météo</span>' +
        '</div>' +
        '<div style="margin-top:16px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(60,40,30,.05);overflow:hidden;flex:1;display:flex;flex-direction:column">' +
          '<div style="display:grid;grid-template-columns:180px repeat(7,1fr);border-bottom:1px solid #F2EEEB">' + headHtml + '</div>' +
          rowsHtml +
        '</div>' +
      '</div>';

    document.getElementById('stage').innerHTML = sidebar + main;
    return {};
  }

  function tickPlanning(t) {
    var chips = document.querySelectorAll('.p-chip');
    var chipsDone = 0;
    for (var i = 0; i < CHIPS.length; i++) {
      var seg = clamp01((t - (0.45 + i * 0.11)) / 0.5);
      if (seg > 0.6) chipsDone++;
    }
    for (var j = 0; j < chips.length; j++) {
      var idx = +chips[j].getAttribute('data-i');
      var p = easeBack(clamp01((t - (0.45 + idx * 0.11)) / 0.5));
      chips[j].style.opacity = p.toFixed(3);
      chips[j].style.transform = 'translateY(' + ((1 - p) * -7).toFixed(2) + 'px) scale(' + (0.7 + 0.3 * p).toFixed(3) + ')';
      chips[j].style.boxShadow = '0 ' + (6 * (1 - p)).toFixed(1) + 'px ' + (10 * (1 - p)).toFixed(1) + 'px rgba(0,0,0,' + (0.18 * (1 - p)).toFixed(3) + ')';
    }
    document.getElementById('p-conf').textContent = chipsDone >= 6 ? 1 : 0;
    document.getElementById('p-sans').textContent = Math.max(0, 7 - Math.min(7, Math.floor(chipsDone / 3)));
  }

  // ============================================================
  //  Timeline
  // ============================================================
  var params = new URLSearchParams(location.search);
  var screen = params.get('screen') === 'planning' ? 'planning' : 'dashboard';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ctx = screen === 'planning' ? buildPlanning() : buildDashboard();
  var tick = screen === 'planning' ? function (t) { tickPlanning(t); } : function (t) { tickDashboard(t, ctx); };

  if (reduce) {
    tick(TOTAL);
    return;
  }

  var state = 0;
  var last = null;
  function frame(now) {
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    state += dt;
    if (state > TOTAL + HOLD) state = 0;
    tick(state);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
